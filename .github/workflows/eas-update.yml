name: Publicar Atualizacao Automatica OTA

on:
  push:
    branches:
      - main

jobs:
  update:
    name: EAS Update (Nuvem)
    # Versao fixa: ubuntu-latest passa para o Ubuntu 26 em 19/10/2026
    runs-on: ubuntu-24.04
    steps:
      - name: 1. Baixar codigo do repositorio
        uses: actions/checkout@v7

      - name: 2. Configurar Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 3. Configurar EAS CLI
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 4. Instalar dependencias
        run: npm ci

      # Se a checagem de tipos ou algum teste falhar, a atualizacao NAO e publicada
      - name: 5. Checar tipos (TypeScript)
        run: npx tsc --noEmit

      - name: 6. Rodar testes automaticos
        run: npm test -- --ci

      - name: 7. Publicar atualizacao online para os aplicativos
        run: eas update --channel production --auto --non-interactive
